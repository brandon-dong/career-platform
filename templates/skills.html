{% extends 'base.html' %}
{% block content %}
<h1>Skills</h1>
{% for group in skills|groupby('category') %}
<section>
  <h2>{{ group.grouper|title }}</h2>
  <p class="tags">{% for skill in group.list %}<span class="tag">{{ skill.name }}</span>{% endfor %}</p>
</section>
{% else %}
<p class="empty">No skills listed yet.</p>
{% endfor %}
{% endblock %}
