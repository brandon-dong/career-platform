# Unknown hostnames and bare-IP requests are closed, not served.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    server_name aws.brandondong.me brandondong.me;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, don't append: the app trusts these headers (app/main.py).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aws.brandondong.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aws.brandondong.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}


server {
    if ($host = brandondong.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aws.brandondong.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name aws.brandondong.me brandondong.me;
    return 404; # managed by Certbot




}
